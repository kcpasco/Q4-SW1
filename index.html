<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Add BS5 CDN here -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body>

    <div class="container">
        <h3>Account Login</h3>

        <details ontoggle="alert('TEST CREDENTIALS: \nUser: admin \nPass: 12345')">
            <summary class="btn btn-sm btn-outline-secondary mb-3">View Login Help</summary>
            <p class="small text-muted">Enter the credentials shown in the alert box.</p>
        </details>

        <form>
            <label for="Uname">Username</label>
            <input type="text" name="Uname" id="UserName" class="form-control">

            <label for="Pcode">Password</label>
            <input type="text" name="Pcode" id="PassCode" class="form-control">

            <!-- add tags to show feedback -->
             <div id="feedback"></div>

            <button class="btn btn-primary" onclick="">Sign In</button>
        </form>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
